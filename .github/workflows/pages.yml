# Deploys the static site to GitHub Pages.
#
# The CV/ submodule points to a private repo, so it is deliberately NOT checked
# out here; the compiled PDF is committed to assets/ by scripts/build-cv.sh.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
